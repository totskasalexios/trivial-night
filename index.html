<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trivial Night — screen</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="tv">
  <div class="tv__bar">
    <span class="eyebrow" id="bar-left">Trivial Night</span>
    <span class="eyebrow" id="bar-right"></span>
  </div>

  <div class="timer hidden" id="timer"><div class="timer__fill" id="timer-fill"></div></div>

  <main class="tv__stage" id="stage"></main>
</div>

<script type="module">
import {
  db, ref, get, set, update, remove, onValue,
  now, makeCode, shuffle, decode
} from "./firebase.js";

const stage    = document.getElementById("stage");
const barLeft  = document.getElementById("bar-left");
const barRight = document.getElementById("bar-right");
const timerEl  = document.getElementById("timer");
const timerFill= document.getElementById("timer-fill");

const state = {
  bank: [],
  code: null,
  round: [],        // questions for this game, answers pre-shuffled
  index: -1,
  players: {},      // pid -> {name, score, isAdmin}
  seconds: 20,
  unsubs: [],
  ticker: null,
  closing: false,
  answered: 0,      // answers in for the current question
  hadPlayers: false,// true once anyone has joined this lobby
  cats: null,       // Set of category names switched on
  diff: "",         // "", easy, medium, hard
  count: 10,        // questions in the game
  mode: "random",   // random | choose
  pool: [],         // questions matching the filters
  used: new Set(),  // indices already asked
  current: null,    // the question on screen
  lastCat: null,    // category of the previous round
  stage: "setup",   // setup | lobby | picking | question | paused | reveal | scores | over
  pausedLeft: 0     // ms left on the clock when paused
};

// Categories switched off when the board first opens. Matched by pattern so
// they still hit whichever way the source spells them.
const OFF_BY_DEFAULT = [/^sports?$/i, /japanese anime/i];

const SECOND_CHOICES   = [10, 20, 30, 50];
const QUESTION_CHOICES = [10, 20, 30, 40, 50];

const lobbyRef = (...path) => ref(db, ["lobbies", state.code, ...path].join("/"));

// ---------- boot ----------

try {
  const res = await fetch("./questions.en.json");
  if (!res.ok) throw new Error(res.status);
  state.bank = await res.json();
} catch (err) {
  stage.innerHTML = `<h1>No question bank</h1>
    <p class="phone__note">questions.en.json could not be loaded. Run
    <code>node tools/fetch-opentdb.mjs</code> to build it, or check the file is
    beside this page.</p>`;
  throw err;
}

renderSetup();

// ---------- setup ----------

function renderSetup() {
  const categories = [...new Set(state.bank.map(q => q.category))].sort();

  if (!state.cats) {
    state.cats = new Set(
      categories.filter(c => !OFF_BY_DEFAULT.some(rx => rx.test(c)))
    );
  }

  stage.innerHTML = `
    <div class="setup">
      <h1>Trivial Night</h1>

      <div class="setup__group setup__group--wide">
        <p class="eyebrow">Categories</p>
        <div class="bubbles" id="g-cat">
          ${categories.map(c => `
            <button class="bubble ${state.cats.has(c) ? "is-on" : ""}"
                    data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join("")}
        </div>
        <div class="bubbles bubbles--tight">
          <button class="bubble bubble--plain" id="cat-all">Select all</button>
          <button class="bubble bubble--plain" id="cat-none">Clear</button>
        </div>
      </div>

      <div class="setup__row">

      <div class="setup__group">
        <p class="eyebrow">Language</p>
        <div class="bubbles bubbles--tight" id="g-lang">
          <button class="bubble is-on" data-lang="en">English</button>
          <button class="bubble is-soon" data-lang="el">Ελληνικά</button>
        </div>
        <p class="setup__note" id="lang-note"></p>
      </div>

      <div class="setup__group">
        <p class="eyebrow">Question order</p>
        <div class="bubbles bubbles--tight" id="g-mode">
          <button class="bubble is-on" data-mode="random">Random categories</button>
          <button class="bubble" data-mode="choose">Choose category</button>
        </div>
      </div>

      <div class="setup__group">
        <p class="eyebrow">Difficulty</p>
        <div class="bubbles bubbles--tight" id="g-diff">
          <button class="bubble is-on" data-diff="">Mixed</button>
          <button class="bubble" data-diff="easy">Easy</button>
          <button class="bubble" data-diff="medium">Medium</button>
          <button class="bubble" data-diff="hard">Hard</button>
        </div>
      </div>

      <div class="setup__group">
        <p class="eyebrow">Seconds per question</p>
        <div class="bubbles bubbles--tight" id="g-secs">
          ${SECOND_CHOICES.map(n => `
            <button class="bubble ${n === 20 ? "is-on" : ""}" data-secs="${n}">${n}</button>`).join("")}
          <button class="bubble" data-secs="0">Off</button>
          <button class="bubble" data-secs="custom">Custom</button>
        </div>
        <input class="setup__custom hidden" id="secs-custom" type="number" min="5" max="300" value="45">
      </div>

      <div class="setup__group">
        <p class="eyebrow">Questions in the game</p>
        <div class="bubbles bubbles--tight" id="g-count">
          ${QUESTION_CHOICES.map(n => `
            <button class="bubble ${n === 10 ? "is-on" : ""}" data-count="${n}">${n}</button>`).join("")}
          <button class="bubble" data-count="custom">Custom</button>
        </div>
        <input class="setup__custom hidden" id="count-custom" type="number" min="1" max="200" value="75">
      </div>

      </div>

      <p class="error" id="setup-error"></p>
      <div><button class="btn btn--big" id="go">Open the lobby</button></div>
    </div>`;

  // Categories toggle independently.
  document.getElementById("g-cat").onclick = (e) => {
    const b = e.target.closest("[data-cat]");
    if (!b) return;
    const cat = b.dataset.cat;
    if (state.cats.has(cat)) { state.cats.delete(cat); b.classList.remove("is-on"); }
    else { state.cats.add(cat); b.classList.add("is-on"); }
  };
  document.getElementById("cat-all").onclick = () => {
    categories.forEach(c => state.cats.add(c));
    document.querySelectorAll("[data-cat]").forEach(b => b.classList.add("is-on"));
  };
  document.getElementById("cat-none").onclick = () => {
    state.cats.clear();
    document.querySelectorAll("[data-cat]").forEach(b => b.classList.remove("is-on"));
  };

  pickOne("g-mode", "mode", (v) => { state.mode = v; });
  pickOne("g-diff", "diff", (v) => { state.diff = v; });
  pickOne("g-secs", "secs", (v) => {
    const custom = document.getElementById("secs-custom");
    custom.classList.toggle("hidden", v !== "custom");
    state.seconds = v === "custom" ? +custom.value : +v;
  });
  pickOne("g-count", "count", (v) => {
    const custom = document.getElementById("count-custom");
    custom.classList.toggle("hidden", v !== "custom");
    state.count = v === "custom" ? +custom.value : +v;
  });

  document.getElementById("secs-custom").oninput  = (e) => { state.seconds = +e.target.value; };
  document.getElementById("count-custom").oninput = (e) => { state.count   = +e.target.value; };

  document.getElementById("g-lang").onclick = (e) => {
    const b = e.target.closest("[data-lang]");
    if (!b) return;
    document.getElementById("lang-note").textContent =
      b.dataset.lang === "el" ? "Greek questions are not in the bank yet." : "";
  };

  state.diff = state.diff ?? "";
  state.mode = state.mode || "random";
  state.seconds = state.seconds || 20;
  state.count = state.count || 10;

  document.getElementById("go").onclick = openLobby;
}

// One live choice per group: highlight the chosen bubble, dim the rest.
function pickOne(groupId, key, apply) {
  const group = document.getElementById(groupId);
  group.onclick = (e) => {
    const b = e.target.closest(`[data-${key}]`);
    if (!b) return;
    group.querySelectorAll(`[data-${key}]`).forEach(x => x.classList.remove("is-on"));
    b.classList.add("is-on");
    apply(b.dataset[key]);
  };
}

async function openLobby() {
  const err   = document.getElementById("setup-error");
  const diff  = state.diff || "";
  const count = Math.min(200, Math.max(1, state.count || 10));
  const secs  = state.seconds === 0 ? 0 : Math.min(300, Math.max(5, state.seconds || 20));

  if (!state.cats.size) {
    err.textContent = "Pick at least one category.";
    return;
  }

  let pool = state.bank.filter(q => state.cats.has(q.category));
  if (diff) pool = pool.filter(q => q.difficulty === diff);

  if (pool.length < count) {
    err.textContent = `Only ${pool.length} questions match that. Lower the count or widen the filters.`;
    return;
  }

  state.seconds = secs;
  state.count = count;
  state.pool = pool;
  state.used = new Set();
  state.lastCat = null;

  // Claim a free code. A lobby older than six hours belongs to a TV that
  // closed without cleaning up, so its code is fair game.
  const STALE_MS = 6 * 60 * 60 * 1000;
  for (let attempt = 0; attempt < 8; attempt++) {
    const code = makeCode();
    const snap = await get(ref(db, `lobbies/${code}`));
    if (snap.exists()) {
      const openedAt = snap.val()?.openedAt || 0;
      if (now() - openedAt < STALE_MS) continue;
      await remove(ref(db, `lobbies/${code}`));
    }
    state.code = code;
    break;
  }
  if (!state.code) { err.textContent = "Could not claim a lobby code. Try again."; return; }

  await set(lobbyRef(), {
    status: "lobby",
    qIndex: -1,
    seconds: secs,
    total: count,
    mode: state.mode,
    endsAt: 0,
    openedAt: now()
  });

  state.stage = "lobby";
  watchPlayers();
  watchStartRequest();
  watchAdvance();
  renderLobby();
}

// ---------- lobby ----------

function joinUrl() {
  return new URL("play.html", location.href).href;
}

function renderLobby() {
  barLeft.textContent = "Waiting for players";
  barRight.textContent = "";
  timerEl.classList.add("hidden");

  stage.innerHTML = `
    <div>
      <p class="eyebrow">Join at</p>
      <p class="joinurl">${joinUrl().replace(/^https?:\/\//, "")}</p>
    </div>
    <div>
      <p class="eyebrow">Lobby code</p>
      <p class="code">${state.code}</p>
    </div>
    <div class="roster" id="roster"></div>
    <p class="phone__note" id="lobby-hint">The first player to join starts the game.</p>
    <div class="lobby__buttons">
      <button class="btn btn--ghost" id="lobby-back">Back to setup</button>
      <button class="btn btn--ghost" id="host-start">Start from here instead</button>
    </div>`;

  document.getElementById("host-start").onclick = startGame;
  document.getElementById("lobby-back").onclick = abandonLobby;
  paintRoster();
}

function paintRoster() {
  const el = document.getElementById("roster");
  if (!el) return;
  const list = Object.entries(state.players)
    .sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0));
  el.innerHTML = list.length
    ? list.map(([, p]) => `<span class="roster__chip" data-admin="${p.isAdmin ? 1 : 0}">${escapeHtml(p.name)}</span>`).join("")
    : `<span class="phone__note">Nobody yet.</span>`;
}

function watchPlayers() {
  state.unsubs.push(onValue(lobbyRef("players"), (snap) => {
    state.players = snap.val() || {};
    const count = Object.keys(state.players).length;

    if (count) state.hadPlayers = true;
    else if (state.hadPlayers) return abandonLobby();

    paintRoster();
    if (state.index >= 0) maybeCloseEarly(state.answered);
    const board = document.getElementById("live-board");
    if (board) paintBoard(board);
  }));
}

// Everyone has left. Drop the lobby so the code is free again and go back
// to the setup screen, ready for a fresh game.
async function abandonLobby() {
  clearInterval(state.ticker);
  if (answersUnsub) { answersUnsub(); answersUnsub = null; }
  if (pickUnsub) { pickUnsub(); pickUnsub = null; }
  document.getElementById("veil")?.remove();
  state.unsubs.forEach(off => off());
  state.unsubs = [];
  const dead = state.code;
  state.code = null;
  state.index = -1;
  state.players = {};
  state.hadPlayers = false;
  state.answered = 0;
  state.closing = false;
  state.stage = "setup";
  state.used = new Set();
  state.lastCat = null;
  state.current = null;
  timerEl.classList.add("hidden");
  if (dead) await remove(ref(db, `lobbies/${dead}`));
  renderSetup();
}

function watchStartRequest() {
  state.unsubs.push(onValue(lobbyRef("control/start"), (snap) => {
    if (snap.val() === true && state.index === -1) startGame();
  }));
}

// ---------- the round ----------

function startGame() {
  if (state.index !== -1) return;
  if (!Object.keys(state.players).length) return;
  beginRound();
}

// ---------- choosing what to ask ----------

// Categories that still have an unasked question in them.
function liveCategories() {
  const left = new Set();
  state.pool.forEach((q, i) => { if (!state.used.has(i)) left.add(q.category); });
  return [...state.cats].filter(c => left.has(c));
}

// Every live category is equally likely, however many questions it holds,
// and the category just used never comes round twice running.
function randomCategory() {
  const live = liveCategories();
  if (!live.length) return null;
  const choices = live.length > 1 ? live.filter(c => c !== state.lastCat) : live;
  const from = choices.length ? choices : live;
  return from[Math.floor(Math.random() * from.length)];
}

function categoryOptions(n = 3) {
  const live = liveCategories();
  const choices = live.length > 1 ? live.filter(c => c !== state.lastCat) : live;
  return shuffle(choices.length ? choices : live).slice(0, n);
}

// Pull an unasked question out of a category and shuffle its answers.
function takeQuestion(category) {
  const ids = [];
  state.pool.forEach((q, i) => { if (!state.used.has(i) && q.category === category) ids.push(i); });
  if (!ids.length) return null;

  const id = ids[Math.floor(Math.random() * ids.length)];
  state.used.add(id);
  const raw = state.pool[id];
  const correct = decode(raw.correct_answer);
  const answers = shuffle([correct, ...raw.incorrect_answers.map(decode)]);
  return {
    category: raw.category,
    question: decode(raw.question),
    answers,
    correct: answers.indexOf(correct)
  };
}

// ---------- the round ----------

async function beginRound() {
  state.index += 1;
  state.closing = false;
  state.answered = 0;

  if (state.index >= state.count) return finish();

  await update(lobbyRef(), { "control/advance": null, "control/pick": null });

  if (state.mode === "choose" && liveCategories().length > 1) return askForCategory();

  const cat = randomCategory();
  if (!cat) return finish();
  askQuestion(cat);
}

// The player on the lowest score picks; ties are broken at random.
function chooser() {
  const entries = Object.entries(state.players);
  if (!entries.length) return null;
  const low = Math.min(...entries.map(([, p]) => p.score || 0));
  const tied = entries.filter(([, p]) => (p.score || 0) === low);
  return tied[Math.floor(Math.random() * tied.length)];
}

async function askForCategory() {
  const picked = chooser();
  if (!picked) return askQuestion(randomCategory());

  const [pid, player] = picked;
  const options = categoryOptions(3);
  if (options.length < 2) return askQuestion(options[0] || randomCategory());

  state.stage = "picking";
  timerEl.classList.add("hidden");
  barLeft.textContent = "Choosing the category";
  barRight.textContent = "";

  stage.innerHTML = `
    <p class="eyebrow">Question ${state.index + 1} of ${state.count}</p>
    <h2 class="question">${escapeHtml(player.name)} is choosing</h2>
    <div class="answers">
      ${options.map((c, i) => `
        <div class="plate plate--${i + 1}" data-i="${i}">
          <span class="numeral">${i + 1}</span>
          <span>${escapeHtml(c)}</span>
        </div>`).join("")}
    </div>
    <p class="phone__note">Lowest score picks. It is on ${escapeHtml(player.name)}'s phone.</p>`;

  await update(lobbyRef(), {
    status: "picking",
    qIndex: state.index,
    endsAt: 0,
    correct: null,
    pick: { pid, name: player.name, options }
  });

  watchPick(options);
}

let pickUnsub = null;
function watchPick(options) {
  if (pickUnsub) pickUnsub();
  pickUnsub = onValue(lobbyRef("control/pick"), (snap) => {
    const choice = snap.val();
    if (choice === null || choice === undefined) return;
    if (pickUnsub) { pickUnsub(); pickUnsub = null; }
    const cat = options[choice] || randomCategory();
    update(lobbyRef(), { "control/pick": null, pick: null });
    askQuestion(cat);
  });
}

async function askQuestion(category) {
  const q = takeQuestion(category);
  if (!q) return finish();

  state.current = q;
  state.lastCat = q.category;
  state.stage = "question";

  await update(lobbyRef(), {
    status: "question",
    qIndex: state.index,
    endsAt: state.seconds ? now() + state.seconds * 1000 : 0,
    correct: null,
    pick: null,
    "control/start": null
  });

  barLeft.textContent = q.category;
  barRight.innerHTML = `<span class="tally" id="tally">0 / ${Object.keys(state.players).length}</span>`;

  stage.innerHTML = `
    <p class="eyebrow">Question ${state.index + 1} of ${state.count}</p>
    <h2 class="question">${escapeHtml(q.question)}</h2>
    <div class="answers">
      ${q.answers.map((a, i) => `
        <div class="plate plate--${i + 1}" data-i="${i}">
          <span class="numeral">${i + 1}</span>
          <span>${escapeHtml(a)}</span>
        </div>`).join("")}
    </div>`;

  runTimer(state.seconds * 1000);
  watchAnswers();
}

// ---------- pause ----------

// Esc on a keyboard, OK on a TV remote.
window.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" && e.key !== "Enter") return;
  if (state.stage !== "question" && state.stage !== "paused") return;
  e.preventDefault();
  state.stage === "question" ? pauseRound() : resumeRound();
});

function pauseRound() {
  state.stage = "paused";
  clearInterval(state.ticker);
  state.pausedLeft = state.seconds ? Math.max(0, state.endsAtLocal - now()) : 0;
  update(lobbyRef(), { status: "paused", endsAt: 0 });

  const veil = document.createElement("div");
  veil.className = "veil";
  veil.id = "veil";
  veil.innerHTML = `<p class="veil__word">Paused</p>
    <p class="phone__note">Esc, or OK on the remote, to carry on.</p>`;
  document.body.appendChild(veil);
}

function resumeRound() {
  state.stage = "question";
  document.getElementById("veil")?.remove();
  const left = state.pausedLeft;
  update(lobbyRef(), {
    status: "question",
    endsAt: state.seconds ? now() + left : 0
  });
  runTimer(state.seconds ? left : 0);
  watchAnswers();
}

function runTimer(ms) {
  clearInterval(state.ticker);

  // Timer off: the question closes only when everyone has answered.
  if (!ms) { timerEl.classList.add("hidden"); return; }

  const startedAt = now();
  state.endsAtLocal = startedAt + ms;
  timerEl.classList.remove("hidden");
  state.ticker = setInterval(() => {
    const left = Math.max(0, 1 - (now() - startedAt) / ms);
    timerFill.style.transform = `scaleX(${left})`;
    if (left <= 0) closeQuestion();
  }, 80);
}

let answersUnsub = null;
function watchAnswers() {
  if (answersUnsub) answersUnsub();
  answersUnsub = onValue(lobbyRef("answers", String(state.index)), (snap) => {
    const answered = Object.keys(snap.val() || {}).length;
    state.answered = answered;
    const tally = document.getElementById("tally");
    if (tally) tally.textContent = `${answered} / ${Object.keys(state.players).length}`;
    maybeCloseEarly(answered);
  });
}

function maybeCloseEarly(answered) {
  if (state.stage === "paused") return;
  const playerCount = Object.keys(state.players).length;
  if (!playerCount) return;
  if (answered === undefined) return;
  if (answered >= playerCount) closeQuestion();
}

// Whichever comes first: everyone in, or the clock runs out.
async function closeQuestion() {
  if (state.closing || state.index < 0) return;
  state.closing = true;
  clearInterval(state.ticker);
  if (answersUnsub) { answersUnsub(); answersUnsub = null; }
  timerEl.classList.add("hidden");

  const q = state.current;
  const snap = await get(lobbyRef("answers", String(state.index)));
  const given = snap.val() || {};

  const updates = {};
  const gained = new Set();
  for (const [pid, entry] of Object.entries(given)) {
    if (!state.players[pid]) continue;
    if (entry.choice === q.correct) {
      updates[`players/${pid}/score`] = (state.players[pid].score || 0) + 1;
      gained.add(pid);
    }
  }
  if (Object.keys(updates).length) await update(lobbyRef(), updates);
  await update(lobbyRef(), { status: "reveal", correct: q.correct });

  revealAnswer(q, gained);
}

// The answer stays up until someone moves it on. Nothing is automatic.
function revealAnswer(q, gained) {
  state.stage = "reveal";
  barRight.textContent = "";
  document.querySelectorAll(".plate").forEach((el) => {
    const i = +el.dataset.i;
    if (i === q.correct) el.classList.add("is-correct");
    else el.classList.add("is-dimmed");
  });

  const names = [...gained].map(pid => state.players[pid]?.name).filter(Boolean);
  const line = document.createElement("p");
  line.className = "phone__note";
  line.style.fontSize = "clamp(16px,1.6vw,30px)";
  line.textContent = names.length
    ? `Point to ${names.join(", ")}.`
    : "Nobody got that one.";
  stage.appendChild(line);

  const cue = document.createElement("p");
  cue.className = "cue";
  cue.textContent = `${adminName()} moves it on.`;
  stage.appendChild(cue);
}

// Whoever holds the controls, for the prompts on the board.
function adminName() {
  const admin = Object.values(state.players).find(p => p.isAdmin);
  return admin ? admin.name : "The first player";
}

function showScores() {
  const last = state.index >= state.count - 1;
  state.stage = last ? "over" : "scores";
  barLeft.textContent = last ? "Final scores" : "Scores";
  stage.innerHTML = `<div class="board" id="live-board"></div>
    <p class="cue">${escapeHtml(adminName())} ${last ? "can start another game." : "calls the next question."}</p>`;
  paintBoard(document.getElementById("live-board"));
  update(lobbyRef(), { status: last ? "over" : "scores", correct: null });
}

// The admin drives the same two steps from their phone.
function watchAdvance() {
  state.unsubs.push(onValue(lobbyRef("control/advance"), (snap) => {
    if (snap.val() !== true) return;
    update(lobbyRef(), { "control/advance": null });
    if (state.stage === "reveal") showScores();
    else if (state.stage === "scores") beginRound();
    else if (state.stage === "over") restart();
  }));
}

function paintBoard(el) {
  if (!el) return;
  const rows = Object.entries(state.players)
    .sort((a, b) => (b[1].score || 0) - (a[1].score || 0));
  el.innerHTML = rows.map(([, p], i) => `
    <div class="board__row">
      <span class="board__rank">${i + 1}</span>
      <span>${escapeHtml(p.name)}</span>
      <span class="board__score">${p.score || 0}</span>
    </div>`).join("");
}

function finish() {
  showScores();
}

async function restart() {
  await remove(lobbyRef("answers"));
  const resets = {};
  for (const pid of Object.keys(state.players)) resets[`players/${pid}/score`] = 0;
  if (Object.keys(resets).length) await update(lobbyRef(), resets);
  state.index = -1;
  state.used = new Set();
  state.lastCat = null;
  state.stage = "lobby";
  await update(lobbyRef(), {
    status: "lobby", qIndex: -1, endsAt: 0, correct: null, pick: null
  });
  renderLobby();
}

// Drop the lobby when the TV closes, so codes do not pile up.
window.addEventListener("pagehide", () => {
  if (state.code) remove(lobbyRef());
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}
